# ContractBoard 設定ファイル

# 依頼作成時の制約
request:
  # 報酬額の下限・上限
  min-reward: 1
  max-reward: 1000000
  # 期限の下限・上限(時間単位)
  min-expire-hours: 1
  max-expire-hours: 168
  # タイトル・詳細説明の最大文字数
  max-title-length: 32
  max-description-length: 200
  # 依頼作成時に報酬へ上乗せする手数料率(0.05 = 5%)。徴収した手数料は消滅する。
  # 依頼が取り下げ・期限切れになった場合も手数料分は返還されない。
  fee-rate: 0.05
  # 受注済み(ACCEPTED)・納品報告済み(DELIVERED)の依頼が放置された場合の猶予時間(時間単位)。
  # ・納品報告後、依頼者が完了承認しないまま経過した場合: 自動的に受注者へ支払われる
  # ・受注後、受注者が納品報告もギブアップもしないまま経過した場合: 依頼者が強制的に募集中へ差し戻せるようになる
  auto-approve-hours: 72
  # 上記の何時間前に、当事者へ事前リマインドを送るか
  reminder-hours-before: 24

# 期限切れチェックの実行間隔(秒)
expiration-check-interval-seconds: 60

messages:
  prefix: "&a[依頼所] &r"
  no-permission: "&cこの操作を行う権限がありません。"
  player-only: "&cこのコマンドはプレイヤーのみ実行できます。"
  unknown-subcommand: "&c不明なサブコマンドです。/irai [create|list|my|cancel]"
  economy-not-found: "&c経済プラグイン(Vault)が見つかりません。管理者に連絡してください。"

  gui:
    main-title: "依頼所"
    list-title: "依頼一覧"
    detail-title: "依頼の詳細"
    my-requests-title: "自分の依頼"
    my-accepted-title: "受注中の依頼"
    rate-title: "評価する"

  create:
    start: "&a依頼作成を開始します。チャットでタイトルを入力してください。(キャンセルは /irai cancel)"
    ask-title: "&aタイトルを入力してください。(最大{max}文字)"
    title-too-long: "&cタイトルは{max}文字以内で入力してください。"
    ask-description: "&a詳細説明を入力してください。(最大{max}文字)"
    description-too-long: "&c詳細説明は{max}文字以内で入力してください。"
    ask-reward: "&a報酬額を数値で入力してください。({min}〜{max}、手数料{fee-percent}%が別途上乗せで徴収されます)"
    invalid-reward: "&c報酬額は{min}〜{max}の整数で入力してください。"
    ask-expire: "&a期限を時間単位の数値で入力してください。({min}〜{max}時間)"
    invalid-expire: "&c期限は{min}〜{max}の整数(時間)で入力してください。"
    insufficient-funds: "&c所持金が足りません。必要額: {amount}(報酬{reward}+手数料{fee})"
    completed: "&a依頼「{title}」を作成しました。報酬{reward}+手数料{fee}=合計{amount}を徴収し、報酬分を依頼所に預けました。"
    cancelled-input: "&e依頼作成をキャンセルしました。"
    no-active-session: "&e進行中の依頼作成はありません。"

  list:
    empty: "&e現在募集中の依頼はありません。"

  accept:
    already-accepted-by-you: "&cすでに1件受注中のため、新しい依頼は受けられません。"
    already-taken: "&cこの依頼はすでに他のプレイヤーが受注しています。"
    own-request: "&c自分の依頼は受注できません。"
    success: "&a依頼「{title}」を受注しました。"

  giveup:
    success: "&e依頼「{title}」の受注を取り消しました。"

  complete:
    approved: "&a依頼「{title}」の完了を承認し、{amount}を{worker}に支払いました。"
    not-accepted: "&cこの依頼はまだ受注されていません。"

  withdraw:
    success: "&e依頼「{title}」を取り下げ、報酬{amount}を返還しました。"
    already-accepted: "&c受注済みの依頼は取り下げできません。"

  deliver:
    success: "&a依頼「{title}」の納品完了を報告しました。依頼者の承認をお待ちください。"
    not-accepted: "&cこの依頼は受注中ではありません。"
    notify-requester: "&a{worker}が依頼「{title}」の納品完了を報告しました。内容を確認し、GUIから完了承認をしてください。"

  auto-approve:
    notify-requester: "&e依頼「{title}」は納品報告から一定時間が経過したため、自動的に完了承認され{worker}に{amount}を支払いました。"
    notify-worker: "&a依頼「{title}」が自動承認され、{amount}が支払われました。"
    reminder-requester: "&e依頼「{title}」は納品報告済みです。あと{hours}時間確認がない場合、自動的に承認され報酬が支払われます。"

  force-revert:
    success: "&e依頼「{title}」の受注を強制的に取り消し、募集中に戻しました。"
    not-eligible: "&cまだ強制的に差し戻せる時間になっていません。"
    notify-worker: "&c依頼者により依頼「{title}」の受注が取り消されました。"
    reminder-worker: "&e依頼「{title}」は受注から時間が経過しています。あと{hours}時間、納品報告もギブアップもない場合、依頼者が受注を取り消せるようになります。"

  expire:
    notify-requester: "&e依頼「{title}」が期限切れになり、報酬{amount}を返還しました。"

  rate:
    success: "&a{worker}を評価しました。(評価{stars}/5)"
    already-rated: "&cこの依頼はすでに評価済みです。"
