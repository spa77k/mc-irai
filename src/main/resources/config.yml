# ContractBoard 設定ファイル

# 依頼作成時の制約
request:
  # 報酬額の下限・上限
  min-reward: 1
  max-reward: 1000000
  # 期限の下限・上限(時間単位)
  min-expire-hours: 1
  max-expire-hours: 168
  # タイトル・詳細説明の最大文字数
  max-title-length: 32
  max-description-length: 200
  # 依頼作成時に報酬へ上乗せする手数料率(0.05 = 5%)。徴収した手数料は消滅する。
  # 依頼が取り下げ・期限切れになった場合も手数料分は返還されない。
  fee-rate: 0.05
  # 受注済み(ACCEPTED)・納品報告済み(DELIVERED)の依頼が放置された場合の猶予時間(時間単位)。
  # ・納品報告後、依頼者が完了承認しないまま経過した場合: 自動的に受注者へ支払われる
  # ・受注後、受注者が納品報告もギブアップもしないまま経過した場合: 依頼者が強制的に募集中へ差し戻せるようになる
  auto-approve-hours: 72
  # 上記の何時間前に、当事者へ事前リマインドを送るか
  reminder-hours-before: 24
  # 完了・取り下げ・期限切れになった依頼を、何日後にデータベースから完全削除するか。0以下で無効化(削除しない)。
  retention-days: 30
  # 依頼作成時に設定できる「受注に必要な最低星数」の上限(0〜この値)。0を指定すると条件なし。
  min-stars-max: 5
  # 依頼作成のチャット入力を何秒放置したら自動キャンセルするか
  input-timeout-seconds: 120

# 納品ボックス・保管庫の設定
box:
  # 納品ボックス・保管庫に入れられないアイテム(Material名)。既定は制限なし。
  # 例: ["BEDROCK", "COMMAND_BLOCK"]
  banned-materials: []
  # 保管庫にこの件数を超えて溜まったら、取り出しを促す警告を出す(チェスト1個分)。
  # 承認や返却そのものは止めないため、超過分も預かり続ける。
  vault-slots: 27
  # 保管庫のアイテムを預かってから何日で削除するか。0以下で無効化(無期限保管)。
  vault-retention-days: 30
  # 削除の何日前に一次警告・最終警告を出すか
  vault-warn-days-before: 3
  vault-final-warn-days-before: 1

# 期限切れチェックの実行間隔(秒)
expiration-check-interval-seconds: 60

