services:
  paper:
    image: itzg/minecraft-server:2026.8.2-java25@sha256:efa878ddb49cf5251b2e5f2ad71b08fd2f7236c1f7907433f6697258b31d2ce4
    container_name: mc-irai-paper
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "127.0.0.1:25575:25575"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.1.2"
      MEMORY: "1G"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "TRUE"
      RCON_PASSWORD: "${MC_RCON_PASSWORD:?MC_RCON_PASSWORD must be set in .env}"
      RCON_PORT: "25575"
      MODE: "creative"
      DIFFICULTY: "peaceful"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "4"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "2"
      MOTD: "mc-irai ContractBoard test server"
      PLUGINS: |
        /plugin-source/ContractBoard.jar
        https://github.com/MilkBowl/Vault/releases/download/1.7.3/Vault.jar
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
    volumes:
      - ./server-data-26.1.2:/data
      - ./target/contractboard-1.0.0.jar:/plugin-source/ContractBoard.jar:ro
